[project]
name = "openfield"
version = "0.1.0"
description = "Version-aware evidence retrieval for Python dependency upgrades"
readme = "README.md"
authors = [
    { name = "Rishabh Das", email = "rishabh.gurukul@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "packaging>=26.3",
    "pydantic>=2.13.5",
]

[project.scripts]
openfield = "openfield.cli:main"

[project.optional-dependencies]
semantic = [
    "fastembed>=0.8.0",
    "numpy>=2.5.3",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
